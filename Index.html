<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fantasy Lottery System v2.0</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="lottery-root">

    <!-- ===========================
         HEADER
    ============================ -->

    <header class="header">

        <h1 class="condensed">
            Fantasy Lottery System
        </h1>

        <div class="subtitle">
            Dynamic Draft Lottery Engine
        </div>

        <div id="round-badge" class="round-badge">
            Initializing...
        </div>

    </header>



    <!-- ===========================
         NAVIGATION
    ============================ -->

    <nav class="tabs">

        <button
            class="tab active"
            onclick="switchTab('lottery')">

            Lottery Draw Arena

        </button>

        <button
            class="tab"
            onclick="switchTab('picks')">

            Draft Board

        </button>

        <button
            class="tab"
            onclick="switchTab('admin')">

            League Controls & Settings

        </button>

    </nav>



    <!-- ===========================
         LOTTERY TAB
    ============================ -->

    <section
        id="tab-lottery"
        class="tab-content active">

        <div class="dashboard-wrapper">

            <div class="main-draw-zone">

                <div class="balls-section">

                    <div
                        id="balls-instruction"
                        class="balls-label">

                        Select a Ball to Draw

                    </div>

                    <div
                        id="balls-row"
                        class="balls-row">
                    </div>

                    <div
                        id="sequence-display"
                        class="sequence-display">
                    </div>

                </div>

                <div id="winner-area"></div>

                <div
                    id="controls-row"
                    class="controls-row">
                </div>

            </div>

            <aside>

                <div class="teams-pane-title">
                    Real-Time Probability Tracking
                </div>

                <div
                    id="teams-grid"
                    class="teams-grid">
                </div>

            </aside>

        </div>

    </section>



    <!-- ===========================
         DRAFT BOARD
    ============================ -->

    <section
        id="tab-picks"
        class="tab-content">

        <div
            id="picks-list"
            class="picks-list">
        </div>

    </section>



    <!-- ===========================
         ADMIN PANEL
    ============================ -->

    <section
        id="tab-admin"
        class="tab-content">

        <div class="admin-panel">

            <!-- Everything that currently
                 lives in the admin tab
                 will be recreated here
                 by admin.js -->

            <div id="admin-root"></div>

        </div>

    </section>

</div>



<!-- ===================================
     PERMUTATION MODAL
==================================== -->

<div
    id="perm-overlay"
    class="perm-overlay"
    style="display:none"
    onclick="closePermModal(event)">

    <div
        class="perm-modal"
        onclick="event.stopPropagation()">

        <div class="perm-modal-header">

            <div>

                <div
                    id="modal-team-name"
                    class="perm-modal-title">
                </div>

                <div
                    id="modal-team-sub"
                    class="perm-modal-sub">
                </div>

            </div>

            <button
                class="perm-close-btn"
                onclick="closePermModal()">

                Close ✕

            </button>

        </div>

        <div class="perm-legend">

            <div>
                <span class="legend-dot alive"></span>
                Active Opportunity
            </div>

            <div>
                <span class="legend-dot struck"></span>
                Eliminated Sequence
            </div>

            <div>
                <span class="legend-dot winner-perm"></span>
                Winning Sequence
            </div>

        </div>

        <div class="perm-scroll">

            <div
                id="modal-perm-grid"
                class="perm-grid">
            </div>

        </div>

    </div>

</div>



<!-- ===================================
     JAVASCRIPT
==================================== -->

<script src="js/config.js"></script>
<script src="js/lottery.js"></script>
<script src="js/ui.js"></script>
<script src="js/admin.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>

</body>
</html>
